name: Build my APK

# Bấm nút "Run workflow" trong tab Actions để build bản mới.
# Kết quả: một mục mới trong trang Releases có file .apk, app trên điện thoại sẽ thấy bản này khi bấm "Kiểm tra cập nhật".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Chua tao 2 Secret KEYSTORE_B64 va KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Check out leveldb + snappy submodules
        run: git submodule update --init --recursive iq80-leveldb/upstream snappy-java/upstream

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version and repo name
        run: |
          VERSION_CODE=$((100000 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i "s/versionCode = [0-9]\+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s#OWNER/REPO#${{ github.repository }}#" app/src/main/java/app/gamenative/utils/UpdateChecker.kt
          grep -n "versionCode =" app/build.gradle.kts
          grep -n "GITHUB_REPO =" app/src/main/java/app/gamenative/utils/UpdateChecker.kt

      - name: Inject dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build APK
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx4g :app:assembleLegacyRelease

      - name: Sign APK with my own key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/my.keystore"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -d "$BT" ]; then
            BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          fi
          APK=$(find app/build/outputs/apk/legacy/release -name '*.apk' | head -n 1)
          echo "Built file: $APK"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/my.keystore" \
            --ks-key-alias mykey \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "gamenative-mine-${VERSION_CODE}.apk" \
            "$APK"
          "$BT/apksigner" verify --print-certs "gamenative-mine-${VERSION_CODE}.apk"
          rm -f "$RUNNER_TEMP/my.keystore"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: build-${{ env.VERSION_CODE }}
          body: "Ban tu build, ma phien ban ${{ env.VERSION_CODE }}."
          files: gamenative-mine-${{ env.VERSION_CODE }}.apk
          make_latest: true
